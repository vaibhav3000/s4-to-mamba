name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
      # The locked environment with CPU torch (uv.lock, cpu extra) and the dev group.
      - name: Sync the locked environment
        run: uv sync --locked --extra cpu
      - name: ruff check
        run: uv run --locked ruff check .
      - name: ruff format
        run: uv run --locked ruff format --check .
      - name: pyright
        run: uv run --locked pyright

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync the locked environment
        run: uv sync --locked --extra cpu
      - name: Run tests
        run: uv run --locked pytest -q

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t ssmbench-test .
      - name: Run tests in the image
        run: docker run --rm ssmbench-test
