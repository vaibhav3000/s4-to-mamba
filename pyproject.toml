[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ssmbench"
version = "1.0.0"
description = "Minimal implementations and GPU benchmarks of efficient sequence models: S4D, Mamba, Mamba-2, Mamba-3, and a Transformer baseline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# torch stays below 2.15 (docs/adr/0007). The cpu and cu130 extras pin the exact build
# and its index for uv; a plain pip install takes any 2.14.x from PyPI.
dependencies = [
    "torch>=2.14,<2.15",
    "numpy",
    "scipy",
    "matplotlib",
    "scikit-learn",
    "datasets",
    "tqdm",
    "pyyaml",
]

[project.scripts]
ssmbench-train = "ssmbench.train.cli:main"
ssmbench-efficiency = "ssmbench.benchmarks.efficiency:main"
ssmbench-summarize = "ssmbench.analysis.summary:main"
ssmbench-inference = "ssmbench.benchmarks.inference:main"
ssmbench-compile = "ssmbench.benchmarks.compile_check:main"
ssmbench-numerics = "ssmbench.benchmarks.numerics:main"

[project.optional-dependencies]
cpu = ["torch==2.14.1"]
cu130 = ["torch==2.14.1"]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "ruff==0.17.5",
    "pyright==1.1.414",
]

[tool.uv]
# One lock holds both torch builds; uv sync --extra cpu or --extra cu130 picks one.
conflicts = [[{ extra = "cpu" }, { extra = "cu130" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A fresh checkout collects without an editable install.
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
# legacy/ holds the original project's scripts verbatim; they are not runnable
# (see legacy/README.md) and are kept out of lint and type checks.
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "PIE", "RUF"]
ignore = ["E501"]

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
include = ["src", "scripts", "tests", "demo-site"]
exclude = ["legacy", "**/node_modules", "**/__pycache__", "**/.*"]
