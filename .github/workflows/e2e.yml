name: Demo E2E

on:
  workflow_dispatch:
  push:
    paths: ["demo-site/**"]

jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
