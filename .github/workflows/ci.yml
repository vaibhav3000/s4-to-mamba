name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  TORCH_SPEC: "torch==2.14.*"
  TORCH_INDEX: https://download.pytorch.org/whl/cpu

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      # pyproject.toml points pyright at .venv, so the tools run from one.
      - name: Create .venv
        run: python -m venv .venv
      - name: Install CPU torch
        run: .venv/bin/python -m pip install "$TORCH_SPEC" --index-url "$TORCH_INDEX"
      - name: Install package with dev tools
        run: .venv/bin/python -m pip install -e ".[dev]"
      - name: ruff check
        run: .venv/bin/ruff check .
      - name: ruff format
        run: .venv/bin/ruff format --check .
      - name: pyright
        run: .venv/bin/pyright

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU torch
        run: python -m pip install "$TORCH_SPEC" --index-url "$TORCH_INDEX"
      - name: Install package
        run: python -m pip install ".[dev]"
      - name: Run tests
        run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t ssmbench-test .
      - name: Run tests in the image
        run: docker run --rm ssmbench-test
